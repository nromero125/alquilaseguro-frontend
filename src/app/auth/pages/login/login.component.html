<div class="bg-image-custom" style="background-image: url('assets/media/PNG/indexLogin.jpg');">
  <div class="row mx-0  bg-default-op">
    <div class="hero-static col-md-6 col-xl-8 d-none d-md-flex align-items-md-end">
      <div class="p-4">
     <!--    <p class="fs-3 fw-semibold text-white">
          Get Inspired and Create.
        </p> -->
     <!--    <p class="text-white-75 fw-medium">
          Copyright &copy; <span data-toggle="year-copy"></span>
        </p> -->
      </div>
    </div>
    <div class="hero-static col-md-6 col-xl-4 d-flex align-items-center bg-body-extra-light">
      <div class="content content-full">
        <div class="text-center d-flex justify-content-center">
          <img src="/assets/media/PNG/AlquilaSeguro_Logo-01.png" class="img-fluid" style="width:300px;" alt="Logo">
         <!--  <h1 class="h3 fw-bold mt-4 mb-1 text-center">Alquila Seguros</h1> -->
        </div>
        <form 
        autocomplete="off" [formGroup]="frm"
        class="js-validation-signin px-4">
        <div class="mb-4">
          <div class="form-floating ">
            <input type="text" class="form-control" id="login-username" name="login-username" placeholder="Introduzca su email.."  formControlName="email">
            <label class="form-label" for="login-username">Email</label>
            <app-errors [controlName]="frm.controls['email']"></app-errors>
          </div>
        </div>
        <div class="mb-4">
          <div class="form-floating ">
            <input type="password" class="form-control" id="login-password" name="login-password" placeholder="Introduzca su contraseña"  formControlName="password">
            <label class="form-label" for="login-password">Password</label>
            <app-errors [controlName]="frm.controls['password']"></app-errors>
          </div>
        </div>
     <!--      <div class="mb-4">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" value="" id="login-remember-me" name="login-remember-me" checked>
              <label class="form-check-label" for="login-remember-me">Remember Me</label>
            </div>
          </div> -->
          <div class="mb-4">
            <button type="submit" class="btn btn-lg bg-tangerine fw-semibold w-100" (click)="login()">
              Iniciar sesión
            </button>
            <div class="mt-4">
           <!--    <a class="fs-sm fw-medium link-fx text-muted me-2 mb-1 d-inline-block" href="op_auth_signup2.html">
                Create Account
              </a> -->
              <div class="w-100 text-center ">
                <a class="fs-sm fw-medium link-fx text-muted me-2 mb-1 d-inline-block " href="op_auth_reminder2.html" routerLink="/auth/forgotPassword">
                  Olvidé mi Contraseña
                </a>
              </div>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
