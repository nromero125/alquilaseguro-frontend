<div class="d-flex justify-content-center align-items-center h-100">
    <form  autocomplete="off" [formGroup]="frm"   class="w-500">
      <div class="block block-rounded w-100">
        <div class="block-header block-header-default">
          <h3 class="block-title">Log in</h3>
        </div>
        <div class="block-content">
          <div class="row justify-content-center py-sm-3 py-md-5">
            <div class="col-sm-10 col-md-8">
              <div class="mb-4">
                <label class="form-label" for="block-form-username">Email</label>
                <input type="email" 
                       class="form-control" 
                       formControlName="email"
                       placeholder="Enter your email..">
              </div>
              <div class="mb-4">
                <label class="form-label" for="block-form-password">Password</label>
                <input type="password" 
                       class="form-control" 
                       formControlName="password"
                       placeholder="Enter your password..">
              </div>
              <div class="mb-3">
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" value="" id="block-form1-remember-me" name="block-form1-remember-me">
                  <label class="form-check-label" for="block-form1-remember-me">Remember Me?</label>
                </div>
              </div>
              <div class="mb-3">
                  <button type="button" class="btn btn-warning w-100" (click)="login()">Log in</button>
              </div>
              <div class="mb-4">
                <div class=" text-center">
                    <a  routerLink="/auth/registration"> Sign up</a>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </form>
  </div>
