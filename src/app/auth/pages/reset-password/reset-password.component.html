<div class="bg-image-custom" style="background-image: url('assets/media/photos/indexLogin.jpg');">
    <div class="row mx-0 bg-default-op">
        <div class="hero-static col-md-6 col-xl-8 d-none d-md-flex align-items-md-end">
            <div class="p-4">

                <p class="text-white-75 fw-medium">
                    Copyright &copy; <span data-toggle="year-copy"></span>
                </p>
            </div>
        </div>
        <div class="hero-static col-md-6 col-xl-4 d-flex align-items-center bg-body-extra-light">
            <div class="content content-full">
                <div class="px-4 py-2 mb-4">
                    <h1 class="h3 fw-bold mt-4 mb-2 text-center">Reiniciar Contraseña</h1>
                </div>
                <form [formGroup]="resetPasswordForm" class="js-validation-reminder px-4"
                    action="be_pages_auth_all.html">
                    
                    <div class="form-floating mb-4">
                        <input [autocomplete]="false" type="email" class="form-control"
                            placeholder="Enter your email or username" formControlName="email">
                        <label class="form-label" 
                            for="reminder-credential">Correo Electrónico</label>
                            <span class="text-danger fs-6 fw-medium">{{controlHasError(resetPasswordForm.controls['email'])}}</span>
                    </div>
                    <div class="form-floating mb-4">
                        <input [autocomplete]="false" type="password" class="form-control"
                            placeholder="Enter your email or username" formControlName="token">
                        <label class="form-label" 
                            for="reminder-credential">Código de Reinicio (Token) </label>
                            <span class="text-danger fs-6 fw-medium">{{controlHasError(resetPasswordForm.controls['token'])}}</span>
                    </div>
                    <div class="form-floating mb-4">
                        <input [autocomplete]="false" type="password" class="form-control"
                            placeholder="Enter your email or username" formControlName="password">
                        <label class="form-label" 
                            for="reminder-credential">Contraseña</label>
                            <span class="text-danger fs-6 fw-medium">{{controlHasError(resetPasswordForm.controls['password'])}}</span>
                    </div>
                    <div class="form-floating mb-4">
                        <input [autocomplete]="false" type="password" class="form-control"
                            placeholder="Enter your email or username"  formControlName="confirmPassword">
                        <label class="form-label" for="reminder-credential">Confirmar Contraseña</label>
                        <span *ngIf="resetPasswordForm?.errors" class="text-danger fs-6 fw-medium">Las contraseñas no coinciden</span>
                    </div>
                    <div class="mb-4">
                        <button [disabled]="resetPasswordForm.invalid" (click)="resetPassword()" type="submit"
                            class="btn btn-lg bg-tangerine fw-semibold w-100">
                            Restablecer la contraseña
                        </button>
                        <div class="mt-4 w-100 text-center" style="cursor: pointer;" routerLink="/auth/login">
                            <a class="fs-sm fw-medium link-fx text-muted me-2 mb-1 d-inline-block">
                                <div>
                                    <i class="fa fa-arrow-left opacity-50 me-1"></i><span>Iniciar sesión</span>
                                </div>
                            </a>
                        </div>
                    </div>
                </form>
                <!-- END Reminder Form -->
            </div>
        </div>
    </div>
</div>
<!-- END Page Content -->
