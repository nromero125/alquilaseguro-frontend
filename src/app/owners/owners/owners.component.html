<div class="block">
    <div class="block-header block-header-default">
        <div class="d-flex gap-2">
        <i class="nav-main-link-icon fa fa-building fs-4"></i>
        <h3 class="block-title">Propiedades</h3>
    </div>
        <div class="block-options">
    <!--         <div class="block-options-item">
                <button type="button" class="btn btn-sm btn-success" data-bs-toggle="tooltip" title="Nueva Propiedad">
                    Agregar <i class="far fa-plus  fw-bold"></i>
                </button>
            </div> -->
        </div>
    </div>
    <div class="block-content">
        <div class="table-responsive">
        <table class="table table-hover table-vcenter">
            <thead>
                <tr>
                    <th class="text-center" style="width: 50px;">ID</th>
                    <th>Nombre Inquilino</th>
                    <th>Dirección</th>
                    <th>Nombre del Dueño</th>
                    <th>Monto alquiler</th>
                    <th class="text-center" style="width: 100px;">Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let property of paginatedPropertyList">
                    <th class="text-center" scope="row">{{property.id}}</th>
                    <td>{{property.tenant.firstname}} {{property.tenant.lastname}}</td>
                    <td>{{property.address}}</td>
                    <td>{{property.owner.firstname}} {{property.owner.lastname}}</td>
                    <td>{{property.monthly_payment | currency}}</td>
                    <td class="text-center">
                        <div class="btn-group">
                    <!--         <button type="button" class="btn btn-sm btn-outline-warning" data-bs-toggle="tooltip"
                                title="Editar">
                                <i class="fa fa-pencil-alt"></i>
                            </button>
                            <button type="button" class="btn btn-sm btn-outline-danger" data-bs-toggle="tooltip"
                                title="Eliminar">
                                <i class="fa fa-times"></i>
                            </button> -->
                            <button type="button" class="btn btn-sm btn-outline-info" data-bs-toggle="tooltip" [routerLink]="['/owners/details',property.id]"
                                title="Ver">
                                <i class="fa fa-eye"></i>
                            </button>
                        </div>
                    </td>
                </tr>
            </tbody>
         
        </table>
        </div>
        <app-paginator 
        [records]="propertiesList"
        (sendPaginatedRecords)="getPaginatedRecords($event)"
        ></app-paginator>
    </div>
</div>
