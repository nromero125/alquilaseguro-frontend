<h1 mat-dialog-title class="modal-header">Crear Usuario</h1>
<div mat-dialog-content class="mat-dialog-content">
    <div class="py-3 px-3">
        <form [formGroup]="userForm">
            <div class="row">
                <div class="form-group col-md-6">
                    <label class="form-label" for="example-text-input">Identificación <span
                            class="text-danger text-monospace legend">*</span></label>
                    <input formControlName="identification" type="text" class="form-control">
                    <app-errors [controlName]="userForm.controls['identification']"></app-errors>
                </div>

                <div class="form-group col-md-6">
                    <label class="form-label" for="example-text-input">Nombre <span
                            class="text-danger text-monospace legend">*</span></label>
                    <input formControlName="firstname" type="text" class="form-control">
                    <app-errors [controlName]="userForm.controls['firstname']"></app-errors>
                </div>

                <div class="form-group col-md-6">
                    <label class="form-label" for="example-text-input">Apellido <span
                            class="text-danger text-monospace legend">*</span></label>
                    <input formControlName="lastname" type="text" class="form-control">
                    <app-errors [controlName]="userForm.controls['lastname']"></app-errors>
                </div>

                <div class="form-group col-md-6">
                    <label class="form-label" for="example-text-input">Dirección <span
                            class="text-danger text-monospace legend">*</span></label>
                    <input formControlName="address" type="text" class="form-control">
                    <app-errors [controlName]="userForm.controls['address']"></app-errors>
                </div>

                <div class="form-group col-md-6">
                    <label class="form-label" for="example-text-input">Número de Teléfono <span
                            class="text-danger text-monospace legend">*</span></label>
                    <input formControlName="phone_number" mask="(000)-000-0000" [autocomplete]="false" type="text"
                        class="form-control">
                        <app-errors [controlName]="userForm.controls['phone_number']"></app-errors>
                </div>

                <div class="form-group col-md-6">
                    <label class="form-label" for="example-text-input">Correo Electrónico <span
                            class="text-danger text-monospace legend">*</span></label>
                    <input formControlName="email" [autocomplete]="false" type="text" class="form-control">
                    <app-errors [controlName]="userForm.controls['email']"></app-errors>
                </div>

                <div *ngIf="!data.isEditing" class="form-group col-md-6">
                    <label class="form-label" for="example-text-input">Contraseña <span
                            class="text-danger text-monospace legend">*</span></label>
                    <input formControlName="password" [autocomplete]="false" type="password" class="form-control">
                    <app-errors [controlName]="userForm.controls['password']"></app-errors>
                </div>
            </div>
        </form>
    </div>





</div>
<div mat-dialog-Acciones class="mat-dialog-actions" align="end">
    <button (click)="closeModal(false)" class="btn btn-danger me-2">Cerrar</button>
    <button *ngIf="!data.isEditing" [disabled]="userForm.invalid" (click)="createUser()"
        class="btn btn-success">Guardar</button>
    <button *ngIf="data.isEditing" [disabled]="userForm.invalid" (click)="updateUser()"
        class="btn btn-success">Editar</button>


</div>
