<h1 mat-dialog-title class="modal-header "><span>Actualizar Contraseña <i class="fa fa-user-lock ms-2"></i></span></h1>
<div mat-dialog-content class="mat-dialog-content">
    <div class="py-3 px-3">
        <form [formGroup]="updatePasswordForm" class="js-validation-reminder change-password-container" style="width: 400px;"
        action="be_pages_auth_all.html">
       
            <div class="mb-4" style="width: 100% !important;">
                <label class="form-label" for="example-text-input">Contraseña Actual <span
                        class="text-danger text-monospace legend">*</span></label>
                <input  [autocomplete]="false" type="password"  formControlName="current_password" class="form-control">
          <app-errors [controlName]="updatePasswordForm.controls['current_password']"></app-errors>
            </div>

        <div class="mb-4"  style="width: 100% !important;">
            <label class="form-label" for="example-text-input">Contraseña<span
                    class="text-danger text-monospace legend">*</span></label>
            <input  [autocomplete]="false" type="password" formControlName="password" class="form-control">
            <app-errors [controlName]="updatePasswordForm.controls['password']"></app-errors>
        </div>

        <div class="mb-4"  style="width: 100% !important;">
            <label class="form-label" for="example-text-input">Confirmar Contraseña<span
                    class="text-danger text-monospace legend">*</span></label>
            <input  [autocomplete]="false" type="password"  formControlName="confirmPassword"class="form-control">
            <app-errors [controlName]="updatePasswordForm.controls['confirmPassword']"></app-errors>
            <span *ngIf="updatePasswordForm?.errors" class="text-danger fs-6">Las contraseñas no coinciden</span>
        </div>
        

     
      
    </form>
    </div>





</div>
<div mat-dialog-Acciones class="mat-dialog-actions" align="end">
    <button (click)="closeModal()" class="btn btn-danger me-2">Cerrar</button>
    <button [disabled]="updatePasswordForm.invalid" (click)="resetPassword()" class="btn btn-success">Actualizar Contraseña</button>


</div>
