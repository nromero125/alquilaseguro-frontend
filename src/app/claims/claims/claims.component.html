<div class="block">
    <div class="block-header block-header-default">
        <h3 class="block-title">Reclamaciones</h3>
        <div class="block-options">
            <div *ngIf="this.current_user.user_type != 5" class="block-options-item">
                <button type="button" (click)="openCreationModal()" class="btn btn-sm btn-success" data-bs-toggle="tooltip" title="Nueva Reclamación">
                    Agregar <i class="far fa-plus  fw-bold"></i>
                </button>
            </div>
        </div>
    </div>
    <div class="block-content">
        <div class="table-responsive">
        <table class="table table-hover table-vcenter">
            <thead>
                <tr >
                    <th class="text-center" style="width: 50px;"></th>
                    <th>Fecha</th>
                    <th>Monto a reclamar</th>
                    <th>Estatus</th>
                    <th>Propiedad</th>
                    <th class="text-center" style="width: 100px;">Acciones</th> 
                </tr>
            </thead>
            <tbody>
                <tr *ngFor=" let  claim of  paginatedClaimsList ">
                    <th class="text-center" scope="row">{{claim.id}}</th>
                    <td>{{claim.created_at | date:'dd/MM/yyyy'}}</td>
                    <td>{{claim.amount_to_claim | currency}}</td>
                    <td>{{claim.status | status }}</td>
                    <td>{{claim.property.name}}</td>
                     <td class="text-center">
                        <div class="btn-group">
                       <!--      <button type="button" class="btn btn-sm btn-outline-warning" data-bs-toggle="tooltip"
                                title="Editar">
                                <i class="fa fa-pencil-alt"></i>
                            </button>
                            <button type="button" class="btn btn-sm btn-outline-danger" data-bs-toggle="tooltip"
                                title="Eliminar">
                                <i class="fa fa-times"></i>
                            </button> -->
                            <button routerLink="/claims/details/{{claim.id}}" type="button" class="btn btn-sm btn-outline-info js-bs-tooltip-enabled" data-bs-toggle="tooltip"
                                title="Ver">
                                <i class="fa fa-eye"></i>
                            </button>
                        </div>
                    </td> 
                </tr>
             
            </tbody>
        </table>
        </div>
        <app-paginator 
        [records]="claimsList"
        (sendPaginatedRecords)="getPaginatedRecords($event)"
        ></app-paginator>
    </div>
</div>
