<div class="block">
    <div class="block-header block-header-default">
        <h1 class="block-title">Pagos</h1>
        <div class="block-options">
            <div class="block-options-item">
                <button (click)="openReportModal()" type="button" class="btn btn-sm btn-success"
                    data-bs-toggle="tooltip" title="Reportar Pago">
                    Reportar <i class="far fa-flag"></i>
                </button>
            </div>
        </div>
    </div>
    <div class="block-content">
        <div class="table-responsive">
        <table class="table table-hover table-vcenter">
            <thead>
                <tr>
                    <th class="text-center" style="width: 50px;"></th>
                    <th>Fecha</th>
                    <th>Monto</th>
                    <th>Tipo</th>
                    <th>Evidencia</th>
                    <th class="text-center" style="width: 100px;">Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let payment of paginatedPaymentsList">
                    <th class="text-center" scope="row">{{payment.id}}</th>
                    <td>{{payment.paid_at | date:'dd/mm/yyyy'}}</td>
                    <td>{{payment.amount}}</td>
                    <td>{{payment.payment_type}}</td>
                    <td><i class="far fa-file-pdf btn btn-outline-danger fw-bold fs-5"></i></td>
                    <td class="text-center">
                        <div class="btn-group">
                            <button type="button" class="btn btn-sm btn-outline-warning" data-bs-toggle="tooltip"
                                title="Editar">
                                <i class="fa fa-pencil-alt"></i>
                            </button>
                            <button type="button" class="btn btn-sm btn-outline-danger" data-bs-toggle="tooltip"
                                title="Eliminar">
                                <i class="fa fa-times"></i>
                            </button>
                            <button type="button" class="btn btn-sm btn-outline-info" data-bs-toggle="tooltip"
                                title="Ver">
                                <i class="fa fa-eye"></i>
                            </button>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
      <app-paginator [records]="paymentsList" (sendPaginatedRecords)="getPaginatedRecords($event)"></app-paginator>
    </div>
</div>
