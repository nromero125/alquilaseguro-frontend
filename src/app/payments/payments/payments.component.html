<div class="block">
    <div class="block-header block-header-default">
        <div class="d-flex gap-2">
            <i class="nav-main-link-icon fa fa-money-bill-transfer fs-4"></i>
            <h1 class="block-title">Pagos</h1>
        </div>
        <div class="block-options">
            <div class="block-options-item">
                <button (click)="openReportModal()" type="button" class="btn btn-sm btn-success"
                    data-bs-toggle="tooltip" title="Reportar Pago">
                    Reportar <i class="far fa-flag"></i>
                </button>
            </div>
        </div>
    </div>
    <div class="block-content">
        <div class="table-responsive">
            <table class="table table-hover table-vcenter">
                <thead>
                    <tr>
                        <th class="text-center" style="width: 50px;"></th>
                        <th>Fecha</th>
                        <th>Monto</th>
                        <th>Tipo</th>
                        <th>Propiedad</th>
                        <th>Estatus</th>
                        <th class="text-center">Comprobante</th>
                        <!-- <th class="text-center" style="width: 100px;">Acciones</th> -->
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let payment of paginatedPaymentsList">
                        <th class="text-center" scope="row">{{payment.id}}</th>
                        <td>{{payment.paid_at | date:'dd/mm/yyyy'}}</td>
                        <td>{{payment.amount}}</td>
                        <td>
                            <span [class]="payment.is_late === 0? 'text-success': 'text-danger'" >{{payment.is_late === 0 ?'A tiempo':'Tardio' }}<i [class]=" payment.is_late === 0 ? 'fa fa-1x ms-2 fa-arrow-trend-up': ' ms-2 fa fa-1x fa-arrow-trend-down ' "></i> </span>
                        </td>
                        <td>{{payment.paid_property || 'N/A'}}</td>
                        <td class="d-none d-sm-table-cell">
                            <span [class]="payment.status === 1? 'badge bg-success': 'badge bg-warning'" >{{payment.status === 1 ?'Verificado':'Pendiente' }}</span>
                        </td>
                        <td class="text-center">
                            <button (click)="setUrl(payment.media[0]?.original_url)" data-bs-toggle="tooltip" title="Ver Comprobante" class="btn btn-outline-danger">
                                <i 
                                    class="far fa-file-pdf  fw-bold fs-5"></i>
                            </button>
                        </td>
                        <!-- <td class="text-center">
                        <div class="btn-group">
                            <button type="button" class="btn btn-sm btn-outline-warning" data-bs-toggle="tooltip"
                                title="Editar">
                                <i class="fa fa-pencil-alt"></i>
                            </button>
                            <button type="button" class="btn btn-sm btn-outline-danger" data-bs-toggle="tooltip"
                                title="Eliminar">
                                <i class="fa fa-times"></i>
                            </button>
                            <button type="button" class="btn btn-sm btn-outline-info" data-bs-toggle="tooltip"
                                title="Ver">
                                <i class="fa fa-eye"></i>
                            </button>
                        </div>
                    </td> -->
                    </tr>
                </tbody>
            </table>
        </div>

        <app-paginator [records]="paymentsList" (sendPaginatedRecords)="getPaginatedRecords($event)"></app-paginator>
    </div>
</div>
